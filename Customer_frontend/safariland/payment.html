<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafariLand – Payment Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="checkout-header">
    <div class="ch-left">
      <a href="my-tickets.html"><img src="assets/logo.png" alt="SafariLand Nature Park" /></a>
      <a class="btn-back" href="park-tickets.html">Back</a>
    </div>
    <div class="ch-right">
      <div class="ch-top">
        <input class="search" type="text" placeholder="Search..." />
        <div class="topbar-right">
          <a class="btn-book" href="park-tickets.html">Book Tickets</a>
          <a class="avatar avatar-blank" href="my-profile.html" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 22c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg></a>
          <span class="username">John Pierre</span>
        </div>
      </div>

      <ol class="stepper">
        <li class="step done"><span class="dot">1</span><span class="label">Tickets</span></li>
        <li class="step-line" aria-hidden="true"></li>
        <li class="step done"><span class="dot">2</span><span class="label">Payment</span></li>
        <li class="step-line" aria-hidden="true"></li>
        <li class="step"><span class="dot">3</span><span class="label">Confirmation</span></li>
      </ol>
    </div>
  </header>

  <main class="checkout-main">
    <div class="payment-grid">

      <!-- Card details -->
      <div class="payment-main">
        <h1 class="title">Payment Details</h1>

        <div class="method-box">Credit / Debit Card</div>

        <form id="payment-form" action="confirmation.html" novalidate>
          <div class="pay-field">
            <label for="holder">Cardholder Name</label>
            <input class="input-lg" id="holder" type="text" autocomplete="cc-name" />
          </div>
          <div class="pay-field">
            <label for="card">Card Number</label>
            <input class="input-lg" id="card" type="text" inputmode="numeric" autocomplete="cc-number" maxlength="19" />
          </div>
          <div class="pay-row">
            <div class="pay-field">
              <label for="expiry">Expiry Date</label>
              <input class="input-lg" id="expiry" type="text" placeholder="MM/YY" autocomplete="cc-exp" maxlength="5" />
            </div>
            <div class="pay-field">
              <label for="cvv">CVV</label>
              <input class="input-lg" id="cvv" type="password" inputmode="numeric" autocomplete="cc-csc" maxlength="4" />
            </div>
          </div>
        </form>
      </div>

      <!-- Order summary -->
      <aside class="summary">
        <h2>Order Summary</h2>

        <div class="summary-brand">
          <img src="assets/logo.png" alt="SafariLand" />
          <div>
            <strong>SafariLand Tickets</strong>
            <small>15 Oct 2026</small>
          </div>
        </div>

        <div id="order-lines"></div>
        <hr />
        <div class="line"><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="line"><span>Service Fee</span><span id="fee"></span></div>
        <div class="line total"><span>Total</span><span id="total"></span></div>

        <button type="submit" form="payment-form" class="btn-primary pay">Pay Now →</button>
      </aside>

    </div>
  </main>

  <script src="assets/jquery.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
