<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafariLand – My Tickets</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <a class="logo" href="my-tickets.html"><img src="assets/logo.png" alt="SafariLand Nature Park" /></a>
    <div class="topbar-content">
      <input class="search" type="text" placeholder="Search..." />
      <div class="topbar-right">
        <a class="btn-book" href="park-tickets.html">Book Tickets</a>
        <a class="avatar avatar-blank" href="my-profile.html" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 22c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg></a>
        <span class="username">John Pierre</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <a href="dashboard.html">Dashboard</a>
      <a href="my-tickets.html" class="active">My Tickets</a>
      <a href="booking-history.html">Booking History</a>
      <a href="#">My review</a>
      <a href="my-profile.html">My Profile</a>
      <a href="#">Log out</a>
    </nav>

    <main class="main has-hero">
      <div class="hero">
        <img src="assets/hero-elephants.png" alt="Elephants crossing a river" />
      </div>

      <h1 class="title">My Tickets</h1>

      <div class="tabs">
        <button class="tab active" data-tab="active">Active Tickets (2)</button>
        <button class="tab" data-tab="past">Past Tickets</button>
      </div>

      <div class="ticket-list" id="tab-active">
        <div class="ticket-row">
          <div class="ticket general">
            <div class="body"><img src="assets/logo.png" alt="SafariLand" /></div>
            <div class="stub"><span>General Pass</span></div>
          </div>
          <button class="btn-outline">Download Ticket</button>
        </div>

        <div class="ticket-row">
          <div class="ticket vip">
            <div class="body"><img src="assets/logo.png" alt="SafariLand" /></div>
            <div class="stub"><span>Vip Pass</span></div>
          </div>
          <button class="btn-outline">Download Ticket</button>
        </div>
      </div>

      <p class="empty-state is-hidden" id="tab-past">You have no past tickets yet.</p>
    </main>
  </div>

  <script src="assets/jquery.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
