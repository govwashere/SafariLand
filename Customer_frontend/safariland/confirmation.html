<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafariLand – Confirmation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="checkout-header">
    <div class="ch-left">
      <a href="my-tickets.html"><img src="assets/logo.png" alt="SafariLand Nature Park" /></a>
      <a class="btn-back" href="my-tickets.html">Back</a>
    </div>
    <div class="ch-right">
      <div class="ch-top">
        <input class="search" type="text" placeholder="Search..." />
        <div class="topbar-right">
          <a class="btn-book" href="park-tickets.html">Book Tickets</a>
          <a class="avatar avatar-blank" href="my-profile.html" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 22c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg></a>
          <span class="username">John Pierre</span>
        </div>
      </div>

      <ol class="stepper">
        <li class="step done"><span class="dot">1</span><span class="label">Tickets</span></li>
        <li class="step-line" aria-hidden="true"></li>
        <li class="step done"><span class="dot">2</span><span class="label">Payment</span></li>
        <li class="step-line" aria-hidden="true"></li>
        <li class="step done"><span class="dot">3</span><span class="label">Confirmation</span></li>
      </ol>
    </div>
  </header>

  <main class="checkout-main">
    <div class="thanks">
      <div class="thanks-text">
        <h1>Thank You</h1>
        <p>Your Tickets have been successfully purchased.</p>
        <small>A confirmation email has been sent to jp@gmail.com</small>
      </div>
      <a class="btn-download-lg" href="my-tickets.html">Download Ticket</a>
    </div>
  </main>

</body>
</html>
